# 이 저장소 자신의 테스트와 shellcheck 를 두 러너에서 돌린다.
# ubuntu 는 bash 5 와 GNU grep, macOS 는 bash 3.2 와 BSD grep 이라 같은 스크립트가 다르게 동작할 수 있다.
name: test

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새로 푸시하면 앞선 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      # 한 러너가 실패해도 다른 러너의 결과를 끝까지 본다. 두 환경의 차이를 보려는 워크플로다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu 러너에는 0.9.0 이 깔려 있고 macOS 러너에는 없다. 판이 다르면 경고도 달라지므로
      # 두 러너 모두 같은 판을 공식 릴리스에서 받고, 받은 파일을 sha256 으로 확인한다.
      - name: shellcheck 준비
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=linux.x86_64;   sum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 ;;
            macOS-ARM64) asset=darwin.aarch64; sum=339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f ;;
            *) echo "shellcheck 자산을 정해 두지 않은 러너다: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          f="shellcheck-$SHELLCHECK_VERSION.$asset.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$f"
          echo "$sum  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      # 테스트 목록의 정본은 .check.toml 이다. 여기에 옮겨 적지 않고 그 줄을 읽어 돌린다.
      - name: 테스트
        run: |
          cmd=$(sed -n 's/^test_command = "\(.*\)"$/\1/p' .check.toml)
          if [ -z "$cmd" ]; then
            echo ".check.toml 에서 test_command 를 읽지 못했다" >&2
            exit 1
          fi
          echo "$cmd"
          bash -c "$cmd"

      # 명령은 CLAUDE.md 「검사 명령」의 shellcheck 줄과 같게 둔다. 한쪽을 고치면 다른 쪽도 고친다.
      - name: shellcheck
        run: |
          shellcheck --version | grep -Fx "version: ${SHELLCHECK_VERSION#v}"
          shellcheck -x -s bash plugin/skills/repo-setup/*/scripts/*.sh plugin/skills/repo-setup/privacy/templates/setup script/setup .githooks/* tests/*.sh tests/*/*.sh
